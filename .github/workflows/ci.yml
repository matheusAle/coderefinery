name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # harness/env.sh defaults to the author's checkout path; point it here.
  REPO_ROOT: ${{ github.workspace }}

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
      - name: Point env.sh at this Go
        run: echo "REPO_GOROOT_BIN=$(go env GOROOT)/bin" >> "$GITHUB_ENV"
      - name: gofmt, vet, test, build
        run: make ci
      - name: Skill launcher tests
        run: tests/launcher_test.sh

  parity:
    # Golden mode: coderefinery vs harness/golden, recorded from upstream on macOS
    # with the toolchain in harness/UPSTREAM.md. No upstream checkout needed.
    # Test-runner banners (pytest prints the platform and Python version) are
    # part of the golden stdout, so the platform and versions are pinned.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
      - name: Point env.sh at this Go
        run: echo "REPO_GOROOT_BIN=$(go env GOROOT)/bin" >> "$GITHUB_ENV"
      - name: Pin the fixture venv to the golden recording
        # fixtures/setup.sh pins pytest and coverage only; pytest's banner also
        # prints pluggy's version. Pre-create the venv with the recorded set,
        # setup.sh then keeps it.
        run: |
          python3 -m venv .local/venvs/fixture-python
          .local/venvs/fixture-python/bin/pip install -q \
            pytest==9.2.0 coverage==7.17.1 pluggy==1.7.0 iniconfig==2.3.1 \
            packaging==26.3 Pygments==2.21.0
      - name: Fixture dependencies
        run: fixtures/setup.sh
      - name: Build coderefinery
        run: make build
      - name: Parity check (36 cases vs golden)
        run: harness/run.sh check
