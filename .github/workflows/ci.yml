name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # harness/env.sh defaults to the author's checkout path; point it here.
  REPO_ROOT: ${{ github.workspace }}

# Actions are pinned by commit; the comment names the release.
jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: Point env.sh at this Go
        run: echo "REPO_GOROOT_BIN=$(go env GOROOT)/bin" >> "$GITHUB_ENV"
      - name: gofmt, vet, test, build
        run: make ci
      - name: Skill launcher tests
        run: tests/launcher_test.sh
      - name: Installer tests (site/public/install.sh)
        run: tests/install_test.sh

  signing-key:
    # The CODEREFINERY_SIGNING_KEY secret must sign with the key whose public
    # half is built into coderefinery (internal/selfupdate), or every release
    # fails to verify. Secrets are not given to pull requests from forks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - name: Sign a probe and verify it with the built-in public key
        env:
          CODEREFINERY_SIGNING_KEY: ${{ secrets.CODEREFINERY_SIGNING_KEY }}
          FROM_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -z "$CODEREFINERY_SIGNING_KEY" ]; then
            if [ "$FROM_FORK" = true ]; then
              echo "::notice::no secrets for pull requests from forks; signing key not checked"
              exit 0
            fi
            echo "::error::secret CODEREFINERY_SIGNING_KEY is missing; see docs/release.md (Signing key)"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/sign-check"
          printf '%064d  coderefinery_0.0.0_linux_amd64.tar.gz\n' 0 > "$RUNNER_TEMP/sign-check/SHA256SUMS"
          go run ./tools/release sign "$RUNNER_TEMP/sign-check"
          go run ./tools/release verify "$RUNNER_TEMP/sign-check"
          echo "CODEREFINERY_SIGNING_KEY matches the public key in internal/selfupdate"

  parity:
    # Golden mode: coderefinery vs harness/golden, recorded from upstream on macOS
    # with the toolchain in harness/UPSTREAM.md. No upstream checkout needed.
    # Test-runner banners (pytest prints the platform and Python version) are
    # part of the golden stdout, so the platform and versions are pinned.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Point env.sh at this Go
        run: echo "REPO_GOROOT_BIN=$(go env GOROOT)/bin" >> "$GITHUB_ENV"
      - name: Pin the fixture venv to the golden recording
        # fixtures/setup.sh pins pytest and coverage only; pytest's banner also
        # prints pluggy's version. Pre-create the venv with the recorded set,
        # setup.sh then keeps it.
        run: |
          python3 -m venv .local/venvs/fixture-python
          .local/venvs/fixture-python/bin/pip install -q \
            pytest==9.2.0 coverage==7.17.1 pluggy==1.7.0 iniconfig==2.3.1 \
            packaging==26.3 Pygments==2.21.0
      - name: Fixture dependencies
        run: fixtures/setup.sh
      - name: Build coderefinery
        run: make build
      - name: Parity check (36 cases vs golden)
        run: harness/run.sh check
