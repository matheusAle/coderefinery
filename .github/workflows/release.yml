name: release

# Push a tag vX.Y.Z equal to CODEREFINERY_VERSION in
# skills/coderefinery/scripts/coderefinery. Publishes
# coderefinery_<X.Y.Z>_<os>_<arch>.tar.gz + SHA256SUMS (the names the launcher
# downloads). The Go module sits at the repo root, so `go install` resolves the
# same vX.Y.Z tag.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  REPO_ROOT: ${{ github.workspace }}
  VERSION: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: .tool-versions
      - name: Point env.sh at this Go
        run: echo "REPO_GOROOT_BIN=$(go env GOROOT)/bin" >> "$GITHUB_ENV"
      - name: Tag must match the launcher's pinned version
        run: |
          pinned=$(sed -n 's/^CODEREFINERY_VERSION=//p' skills/coderefinery/scripts/coderefinery)
          if [ "$pinned" != "$VERSION" ]; then
            echo "::error::tag $VERSION does not match CODEREFINERY_VERSION=$pinned in skills/coderefinery/scripts/coderefinery"
            exit 1
          fi
      - name: gofmt, vet, test, build
        run: make ci
      - name: Build release archives
        run: make dist VERSION="$VERSION"
      - name: Smoke test the linux/amd64 binary
        run: |
          got=$(dist/coderefinery_${VERSION#v}_linux_amd64/coderefinery --version)
          test "$got" = "coderefinery $VERSION" || { echo "::error::--version printed '$got'"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --verify-tag --title "coderefinery $VERSION" --generate-notes \
            dist/coderefinery_${VERSION#v}_*.tar.gz dist/SHA256SUMS

  verify:
    # The skill's launcher, from a clean cache, installs what was just published.
    needs: release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Launcher downloads, verifies and runs the release
        run: |
          got=$(env -i HOME="$RUNNER_TEMP/home" PATH=/usr/bin:/bin skills/coderefinery/scripts/coderefinery --version)
          test "$got" = "coderefinery $VERSION" || { echo "::error::launcher printed '$got'"; exit 1; }
